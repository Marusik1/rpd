name = "rpd-telegram-bot"
main = "src/index.ts"
compatibility_date = "2025-09-02"

[vars]
ENVIRONMENT = "production"
MINI_APP_URL = "https://your-user.github.io/your-repository/"
MINI_APP_ORIGIN = "https://your-user.github.io"
PUBLIC_CATALOG_URL = "https://your-user.github.io/your-repository/catalog.json"

# Replace the public placeholders above before deployment. Production CORS
# accepts only MINI_APP_ORIGIN exactly; a wildcard is never supported.
# Store BOT_TOKEN and TELEGRAM_WEBHOOK_SECRET only with `wrangler secret put`.

[env.dev.vars]
ENVIRONMENT = "development"
MINI_APP_URL = "http://localhost:5173/"
MINI_APP_ORIGIN = "https://your-user.github.io"
PUBLIC_CATALOG_URL = "http://localhost:5173/catalog.json"
DEV_MINI_APP_ORIGIN = "http://localhost:5173"
